<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ayush Regmi">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A24">
        <animate attributeName="stop-color" values="#071A24;#0B4F6C;#071A24" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0B4F6C">
        <animate attributeName="stop-color" values="#0B4F6C;#1B9AAA;#0B4F6C" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#062833">
        <animate attributeName="stop-color" values="#062833;#145C6B;#062833" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B9AAA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F4A261" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1B9AAA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B9AAA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B9AAA" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- soft floating orbs -->
  <circle cx="160" cy="90" r="48" fill="#1B9AAA" opacity="0.12">
    <animate attributeName="cy" values="90;70;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="70" r="70" fill="#F4A261" opacity="0.1">
    <animate attributeName="cy" values="70;95;70" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="210" r="36" fill="#1B9AAA" opacity="0.16">
    <animate attributeName="cx" values="920;960;920" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- animated accent line -->
  <rect x="360" y="148" width="480" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" filter="url(#softGlow)">
    Ayush Regmi
  </text>

  <!-- subtitle -->
  <text x="600" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#B8E6EC">
    FastTrack CS @ UT Dallas  ·  Class of 2026
  </text>
  <text x="600" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7FB8C4">
    Software engineer  ·  AI builder  ·  Product shipper
  </text>

  <!-- animated waves -->
  <g transform="translate(0,245)">
    <path fill="url(#waveFill)" d="M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1125,40 1200,30 L1200,80 L0,80 Z">
      <animate attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        values="
          M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1125,40 1200,30 L1200,80 L0,80 Z;
          M0,35 C150,65 300,15 450,45 C600,75 750,20 900,50 C1050,70 1125,25 1200,40 L1200,80 L0,80 Z;
          M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1125,40 1200,30 L1200,80 L0,80 Z"/>
    </path>
    <path fill="#1B9AAA" opacity="0.25" d="M0,50 C200,25 350,70 550,45 C750,20 950,70 1200,40 L1200,80 L0,80 Z">
      <animate attributeName="d"
        dur="5s"
        repeatCount="indefinite"
        values="
          M0,50 C200,25 350,70 550,45 C750,20 950,70 1200,40 L1200,80 L0,80 Z;
          M0,45 C200,70 350,30 550,55 C750,75 950,25 1200,50 L1200,80 L0,80 Z;
          M0,50 C200,25 350,70 550,45 C750,20 950,70 1200,40 L1200,80 L0,80 Z"/>
    </path>
  </g>
</svg>

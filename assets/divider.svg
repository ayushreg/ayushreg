<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B9AAA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1B9AAA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1B9AAA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="50" y="13" width="800" height="2" rx="1" fill="url(#line)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="14" r="4" fill="#F4A261">
    <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
